# Minimum review level per changed file, used by the `chunks` render.
# A chunk's level is the highest of the model's level and the floors of its files.
# Levels, lowest to highest: skim, read, verify. (Older variants' "read carefully" is read as verify.)
# A breaking API change or a destructive migration also raises a chunk to verify, whatever the floors say; the
# migration files are the ones matched by `migration_globs` in local.toml.
# Globs: `*` matches within one path segment, `**/` matches any number of directories, `**` matches anything.
# These entries are made up. The real review_floor.toml is specific to one repository: copy this file to
# review_floor.toml (git-ignored) and list the paths where a mistake costs the most. Without a real file,
# this example is used.

[[floor]]
name = "DB migration"
level = "read"
level_if_deleted = "verify"
globs = ["**/db/migrations/**"]

# `deleted_from = "contract"` (optional) makes `level_if_deleted` apply only when the run's contract.json, saved from
# the context pack's contract section, lists a breaking change for the file: a removal, or a field callers must now
# supply (a newly required property or parameter). Without the key, or for a run with no contract.json, any deleted
# line in the file counts. contract.json covers the file named by local.toml's openapi_path.
# A generated spec has no `level_if_deleted`: a breaking change in it raises the hand-written chunk that makes the change.
[[floor]]
name = "OpenAPI spec"
level = "skim"
globs = ["api/openapi.json"]

[[floor]]
name = "public API controller"
level = "read"
level_if_deleted = "verify"
globs = ["**/controllers/**"]

# Shown on the file row; no floor. A chunk whose files all carry the `generated` tag is labelled `generated`.
[[tag]]
name = "generated"
globs = ["**/*.generated.*", "api/openapi.json"]
