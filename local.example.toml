# Copy this file to local.toml (git-ignored) and fill in what you have. Every key is optional:
# the context-pack section that needs a missing key is skipped, and run.json records why.
# Use paths as they appear in the repository, relative to its root, with forward slashes.

# The GitHub repository run.py reads, as "owner/name", through the `gh` CLI. Passing --repo overrides it;
# with neither, run.py exits and asks for one.
repo = "example-org/example-repo"

# The Chrome or Chromium that draws diagram.svg. Without this key, render.py looks at the PR_BRIEF_CHROME environment
# variable first, then (when this key is unset) google-chrome, google-chrome-stable, chromium and chromium-browser on PATH,
# then the macOS install. With none the run fails; it never ships a brief without its diagram.
# chrome = "/usr/bin/chromium"

# Sections "callers" and "contract" search a bare mirror of the repository kept in .cache/.
# source_checkout is a local clone the mirror is first cloned from; without it no mirror is created. In a GitHub
# Actions job it defaults to the workflow's checkout (GITHUB_WORKSPACE).
source_checkout = "/path/to/your/clone/of/example-repo"
# github_url is where commits missing from the mirror are fetched, using the `gh` credential helper;
# without it nothing is fetched and a PR whose commits the mirror lacks loses these two sections.
github_url = "https://github.com/example-org/example-repo.git"
# Folder name of the mirror inside .cache/ (default "mirror.git").
mirror_name = "example-repo.git"

# Section "contract": the OpenAPI document, compared between the base and head commits when the PR changes it.
openapi_path = "api/openapi.json"

# Section "migrations": a new file whose path contains one of these is scanned for destructive SQL.
migration_dirs = ["db/migrations/"]

# The brief's Data section lists the tables these files touch.
# Globs over repository paths, `*` within a folder and `**` across folders. Without it the section says the database
# side was not checked.
migration_globs = ["db/migrations/*.sql"]

# Precise caller matching for TypeScript. All four are optional; without them only relative imports are resolved.
# A client package that is generated in-repo: its folder, and the specifier other packages import it by.
sdk_dir = "web/sdk/"
sdk_specifier = "@example/sdk"
# How a workspace package specifier maps to a folder: workspace_alias is a regular expression whose
# group 1 is the package name and optional group 2 the path inside it; the import then resolves to
# <workspace_root>/<group 1>/<group 2>.
workspace_alias = '^@example/([\w-]+)(?:/(.*))?$'
workspace_root = "web"

# Directory markers (substrings of a path) that make a file a test, in addition to the built-in
# "/src/test/", ".test." and "Test.java". Test files are never listed as callers.
test_dirs = ["/src/integrationTest/"]

# Where a contract line finds its source in the PR needs no setting. The OpenAPI document is generated from the Java code:
# a schema is a changed non-test Java file's record, class or enum of that name, and an operation is the method of that
# name in a changed non-test Java file that is a controller (@RestController or @Controller). The generated client under
# sdk_dir (above) is searched the same way, so a line also traces to its declaration in a changed .ts file there.

# Pathspec globs (git grep syntax without the leading ":!") excluded from the callers search when a
# variant sets callers_code_only, in addition to markdown, lock and similar files.
callers_exclude_globs = ["**/docs/**", "**/*.generated.*"]

# The variant run.py uses when --variant is not given.
default_variant = "brief"

# The model each runner uses, by runner name; `run.py --model` overrides it. Unset runners use their pinned default
# (claude-opus-5-5 for claude, claude-opus-5.5 for copilot), and run.json records the id a run used. Keep this table last:
# keys after a table header belong to it.
# [model]
# claude = "claude-opus-5-5"
