<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR Describe Review Focus</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 6px 8px; font: inherit; }
    button { margin-top: 16px; padding: 6px 12px; font: inherit; }
    small { color: #59636e; }
  </style>
</head>
<body>
  <h1>Review focus</h1>
  <form id="form">
    <label for="variant">Variant</label>
    <input id="variant" required>
    <label for="baseUrl">Server base URL</label>
    <input id="baseUrl" type="url" required>
    <small>The extension may only reach http://127.0.0.1:8765; another origin needs a matching entry in manifest.json host_permissions.</small>
    <div><button type="submit">Save</button> <span id="status" role="status"></span></div>
  </form>
  <script type="module" src="options.js"></script>
</body>
</html>
